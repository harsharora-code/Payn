name : Build on PR

on: 
  pull_request:
    branches: 
      -master

jobs:
  Build: 
      runs-on: ubutnu-latest
  steps: 
    -users:  actions/checkout@v4

    -users: actions/setup-node@v4

    with: 
          node-version: 20

-name: Install Dependencies
run : npm install

-name: Generate Prisma Client
run: npm run db:generate

-name: Run Build 
run: npm run build
